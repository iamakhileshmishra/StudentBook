# ──────────────────────────────────────────────────────────────
# PROD profile — all values via environment variables
# ──────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.schoolerp=INFO
logging.level.org.springframework.security=WARN

# API docs are not public in production (SEC-13)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# HTTPS in production: refresh cookie must be Secure (SEC-14)
app.cookie.secure=${COOKIE_SECURE:true}

# ──────────────────────────────────────────────────────────────
# Hosting (Render free tier + Neon Postgres)
# ──────────────────────────────────────────────────────────────
# Render tells the app which port to listen on
server.port=${PORT:8080}
# Note: no server.forward-headers-strategy here. Spring's handling takes the FIRST
# X-Forwarded-For entry (client-controlled) as the remote address, which would let
# anyone dodge rate limits; RateLimitFilter reads the proxy-appended LAST entry instead.
# Free Postgres plans allow few connections; keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Frontend and API are served from the same origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}}
# Links in emails point at the public address; Render provides RENDER_EXTERNAL_URL
app.frontend-url=${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
