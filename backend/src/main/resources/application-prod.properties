# ──────────────────────────────────────────────────────────────
# PROD profile — all values via environment variables
# ──────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.schoolerp=INFO
logging.level.org.springframework.security=WARN

# API docs are not public in production (SEC-13)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# HTTPS in production: refresh cookie must be Secure (SEC-14)
app.cookie.secure=${COOKIE_SECURE:true}
