# ──────────────────────────────────────────────────────────────
# Base application properties (shared across all profiles)
# ──────────────────────────────────────────────────────────────
spring.application.name=school-erp

# Active profile — override in environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ──────────────────────────────────────────────────────────────
# JPA
# ──────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ──────────────────────────────────────────────────────────────
# JWT Configuration
# ──────────────────────────────────────────────────────────────
# No default on purpose: startup fails if JWT_SECRET is missing, shorter than 64
# bytes, or (outside the dev profile) one of the example values in this repo.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiry-ms=900000
# 15 minutes = 900,000 ms
app.jwt.refresh-token-expiry-ms=604800000
# 7 days = 604,800,000 ms

# ──────────────────────────────────────────────────────────────
# CORS (override in profile-specific files)
# ──────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ──────────────────────────────────────────────────────────────
# Mail (account-creation emails)
# Dev defaults point at Mailpit (docker compose); set real SMTP via env in prod.
# ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:School ERP <no-reply@schoolerp.local>}
# Used for the login link in emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ──────────────────────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────
logging.level.com.schoolerp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
