# ──────────────────────────────────────────────────────────────
# Base application properties (shared across all profiles)
# ──────────────────────────────────────────────────────────────
spring.application.name=school-erp

# Active profile — override in environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ──────────────────────────────────────────────────────────────
# JPA
# ──────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ──────────────────────────────────────────────────────────────
# JWT Configuration
# ──────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ThisIsADevSecretKeyThatMustBeChangedInProductionAndShouldBe64CharsLong!!!}
app.jwt.access-token-expiry-ms=900000
# 15 minutes = 900,000 ms
app.jwt.refresh-token-expiry-ms=604800000
# 7 days = 604,800,000 ms

# ──────────────────────────────────────────────────────────────
# CORS (override in profile-specific files)
# ──────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ──────────────────────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────
logging.level.com.schoolerp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
