# ══════════════════════════════════════════════════════════════════════════
# Docker Compose — DEVELOPMENT ONLY
# Usage: docker compose up -d
# The passwords and JWT secret below are public dev values. Never reuse this
# file for a server: production needs its own secrets (see .env.template) and
# the backend refuses the example JWT secrets outside the dev profile.
# ══════════════════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: schoolerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolerp
      POSTGRES_USER: schoolerp
      POSTGRES_PASSWORD: schoolerp_dev
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — not reachable from the network (SEC-15)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolerp -d schoolerp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolerp_network

  # ────────────────────────────────────────────────────────────────────────
  # Spring Boot Backend
  # In dev: runs from the JAR built on host machine
  # ────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolerp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolerp
      SPRING_DATASOURCE_USERNAME: schoolerp
      SPRING_DATASOURCE_PASSWORD: schoolerp_dev
      JWT_SECRET: DevSecretKeyChangeInProductionMustBe64CharactersLongAtMinimumOk!
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - schoolerp_network

  # ────────────────────────────────────────────────────────────────────────
  # Mailpit (dev mail catcher — no email leaves your machine)
  # Inbox UI at http://localhost:8025
  # ────────────────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: schoolerp_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - schoolerp_network

  # ────────────────────────────────────────────────────────────────────────
  # pgAdmin (Database GUI — dev only)
  # Access at http://localhost:5050
  # Email: admin@schoolerp.dev | Password: admin
  # ────────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolerp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@schoolerp.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - schoolerp_network
    profiles:
      - tools  # Only start with: docker compose --profile tools up

volumes:
  postgres_data:
    driver: local

networks:
  schoolerp_network:
    driver: bridge
